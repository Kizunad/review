name: Central PR review

on:
  workflow_call:
    inputs:
      pr_number:
        description: Pull request number in the calling repository
        required: true
        type: number
      policy_path:
        description: Trusted base-revision review policy path
        required: true
        type: string
      review_base_url:
        description: Claude-compatible provider base URL
        required: true
        type: string
      shadow:
        description: Publish a non-gating shadow review
        required: false
        default: false
        type: boolean
      max_diff_chars:
        description: Maximum immutable diff characters per Terra finder
        required: false
        default: 40000
        type: number
      max_shard_chars:
        description: Maximum Luna shard characters
        required: false
        default: 12000
        type: number
      worker_timeout_ms:
        description: Per-Claude-process timeout
        required: false
        default: 120000
        type: number
      circuit_manual_retry:
        description: Allow a trusted workflow_dispatch retry to bypass an open infrastructure circuit
        required: false
        default: false
        type: boolean
    secrets:
      review_api_key:
        description: Caller-owned provider credential
        required: true

permissions: {}

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
      issues: read
    outputs:
      base_oid: ${{ steps.pr.outputs.base_oid }}
      head_oid: ${{ steps.pr.outputs.head_oid }}
      workflow_ref: ${{ steps.central.outputs.workflow_ref }}
      circuit_should_run: ${{ steps.circuit.outputs.should_run }}
      circuit_open_until: ${{ steps.circuit.outputs.open_until }}
    steps:
      - name: Resolve and checkout immutable central implementation
        id: central
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_response="$(curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT")"
          workflow_ref="$(jq -er '
            [
              .referenced_workflows[]?
              | select(.path | startswith("Kizunad/review/.github/workflows/review.yml@"))
              | {path, sha}
            ]
            | if length == 1 then .[0] else error("expected exactly one central review workflow reference") end
            | select(.path == ("Kizunad/review/.github/workflows/review.yml@" + .sha))
            | .sha
            | ascii_downcase
            | select(test("^[0-9a-f]{40}$"))
          ' <<<"$run_response")"
          git init --quiet _central
          git -C _central remote add origin https://github.com/Kizunad/review.git
          git -C _central -c protocol.version=2 fetch --no-tags --depth=1 origin "$workflow_ref"
          git -C _central checkout --quiet --detach FETCH_HEAD
          actual="$(git -C _central rev-parse HEAD)"
          [[ "$actual" == "$workflow_ref" ]] || { echo 'Central checkout does not match the referenced workflow SHA.' >&2; exit 1; }
          printf 'workflow_ref=%s\n' "$actual" >> "$GITHUB_OUTPUT"
      - name: Fetch authoritative PR OIDs from GitHub API
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo 'Invalid PR number.' >&2; exit 1; }
          response="$(curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          base_oid="$(jq -er '.base.sha | select(test("^[0-9a-f]{40}$"))' <<<"$response")"
          head_oid="$(jq -er '.head.sha | select(test("^[0-9a-f]{40}$"))' <<<"$response")"
          jq -n --arg repository "$GITHUB_REPOSITORY" --argjson pullNumber "$PR_NUMBER" --arg baseOid "$base_oid" --arg headOid "$head_oid" \
            '{repository:$repository,pullNumber:$pullNumber,baseOid:$baseOid,headOid:$headOid}' > pr-context.json
          printf 'base_oid=%s\nhead_oid=%s\n' "$base_oid" "$head_oid" >> "$GITHUB_OUTPUT"
      - name: Evaluate caller infrastructure circuit
        id: circuit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REVIEW_TRIGGER: ${{ github.event_name }}
          REVIEW_COMMENT_BODY: ${{ github.event.comment.body || '' }}
          CIRCUIT_MANUAL_RETRY: ${{ inputs.circuit_manual_retry }}
          CIRCUIT_THRESHOLD: '3'
          CIRCUIT_WINDOW_MINUTES: '60'
          CIRCUIT_DURATION_MINUTES: '60'
        run: |
          set -euo pipefail
          node _central/src/run-circuit.mjs preflight
      - name: Upload trusted PR context
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: pr-context.json
          if-no-files-found: error
          retention-days: 1

  review:
    name: read-only review
    needs: preflight
    if: needs.preflight.outputs.circuit_should_run == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      review_outcome: ${{ steps.review.outcome }}
    steps:
      - name: Checkout fixed central implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Kizunad/review
          ref: ${{ needs.preflight.outputs.workflow_ref }}
          path: _central
          persist-credentials: false
          fetch-depth: 1
      - name: Verify central implementation OID
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C _central rev-parse HEAD)" == "${{ needs.preflight.outputs.workflow_ref }}" ]]
      - name: Download trusted PR context
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pr-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: _input
      - name: Checkout trusted caller base for policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.preflight.outputs.base_oid }}
          path: _base
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout exact caller head into isolated directory
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.preflight.outputs.head_oid }}
          path: _caller
          persist-credentials: false
          fetch-depth: 0
      - name: Stage and verify trusted policy
        shell: bash
        env:
          POLICY_PATH: ${{ inputs.policy_path }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { copyFile, mkdir } from "node:fs/promises";
            import { assertRegularFileInsideWorkspace } from "./_central/src/workspace-boundary.mjs";
            const source = await assertRegularFileInsideWorkspace("_base", process.env.POLICY_PATH);
            if (source.size < 2 || source.size > 262144) throw new Error("policy must be a bounded regular file");
            await mkdir("_trusted", { recursive: true });
            await copyFile(source.path, "_trusted/policy.json");
            JSON.parse(await (await import("node:fs/promises")).readFile("_trusted/policy.json", "utf8"));
          '
      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          check-latest: false
      - name: Install hash-pinned Claude Code
        uses: ./_central/.github/actions/setup-claude
      - name: Install pinned Bubblewrap sandbox
        shell: bash
        env:
          BWRAP_URL: https://security.ubuntu.com/ubuntu/pool/main/b/bubblewrap/bubblewrap_0.9.0-1ubuntu0.1_amd64.deb
          BWRAP_SHA256: 1b506492bd9c7fd0cdb4f02ac822f1d3e336b0aead5113c1239baf8db5db562a
        run: |
          set -euo pipefail
          mkdir -p _sandbox-package
          curl --fail-with-body --silent --show-error --location "$BWRAP_URL" -o _sandbox-package/bubblewrap.deb
          printf '%s  %s\n' "$BWRAP_SHA256" '_sandbox-package/bubblewrap.deb' | sha256sum --check --strict
          dpkg-deb --extract _sandbox-package/bubblewrap.deb _sandbox-package/root
          bwrap_executable="$GITHUB_WORKSPACE/_sandbox-package/root/usr/bin/bwrap"
          [[ -f "$bwrap_executable" && -x "$bwrap_executable" ]] || { echo 'Pinned Bubblewrap executable is missing.' >&2; exit 1; }
          [[ "$($bwrap_executable --version)" == 'bubblewrap 0.9.0' ]]
          sudo chown root:root "$bwrap_executable"
          sudo chmod 4755 "$bwrap_executable"
          [[ "$(stat -c '%U:%G %a' "$bwrap_executable")" == 'root:root 4755' ]]
          "$bwrap_executable" --unshare-all --share-net --die-with-parent --new-session \
            --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib --symlink usr/lib64 /lib64 \
            --dev /dev --proc /proc --tmpfs /tmp -- /bin/true
          printf 'BWRAP_EXECUTABLE=%s\n' "$bwrap_executable" >> "$GITHUB_ENV"
      - name: Verify caller checkout and build immutable diff
        shell: bash
        env:
          BASE_OID: ${{ needs.preflight.outputs.base_oid }}
          HEAD_OID: ${{ needs.preflight.outputs.head_oid }}
        run: |
          set -euo pipefail
          actual="$(git -C _caller rev-parse HEAD)"
          [[ "$actual" == "$HEAD_OID" ]] || { echo 'Caller checkout HEAD differs from authoritative PR head.' >&2; exit 1; }
          git -C _caller -c core.hooksPath=/dev/null diff --no-ext-diff --no-renames --binary "$BASE_OID" "$HEAD_OID" > _input/review.diff
      - name: Run deterministic Claude Code review
        id: review
        continue-on-error: true
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.review_api_key }}
          ANTHROPIC_BASE_URL: ${{ inputs.review_base_url }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
          CENTRAL_ROOT: ${{ github.workspace }}/_central
          CALLER_ROOT: ${{ github.workspace }}/_caller
          REPOSITORY: ${{ github.repository }}
          POLICY_FILE: ${{ github.workspace }}/_trusted/policy.json
          DIFF_PATH: ${{ github.workspace }}/_input/review.diff
          CONTEXT_PATH: ${{ github.workspace }}/_input/pr-context.json
          OUTPUT_DIRECTORY: ${{ github.workspace }}/_output
          WORKFLOW_REF: ${{ needs.preflight.outputs.workflow_ref }}
          REVIEW_HEAD_OID: ${{ needs.preflight.outputs.head_oid }}
          MAX_DIFF_CHARS: ${{ inputs.max_diff_chars }}
          MAX_SHARD_CHARS: ${{ inputs.max_shard_chars }}
          WORKER_TIMEOUT_MS: ${{ inputs.worker_timeout_ms }}
          SHADOW: ${{ inputs.shadow }}
          CLAUDE_EXECUTABLE: ${{ env.CLAUDE_EXECUTABLE }}
          RIPGREP_EXECUTABLE: ${{ env.RIPGREP_EXECUTABLE }}
          BWRAP_EXECUTABLE: ${{ env.BWRAP_EXECUTABLE }}
        run: |
          set -euo pipefail
          mkdir -p _output
          node _central/src/run-review.mjs
      - name: Upload review artifacts and bound manifest
        if: always() && hashFiles('_output/review.json', '_output/review.md', '_output/manifest.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: central-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _output/review.json
            _output/review.md
            _output/manifest.json
          if-no-files-found: error
          retention-days: 1

  finalize:
    name: write finalize
    needs: [preflight, review]
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout fixed central finalizer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Kizunad/review
          ref: ${{ needs.preflight.outputs.workflow_ref }}
          path: _central
          persist-credentials: false
          fetch-depth: 1
      - name: Publish circuit skip notice
        if: needs.preflight.outputs.circuit_should_run == 'false'
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          CIRCUIT_OPEN_UNTIL: ${{ needs.preflight.outputs.circuit_open_until }}
        run: |
          set -euo pipefail
          node _central/src/run-circuit.mjs skip-comment
      - name: Checkout trusted caller base for policy binding
        if: needs.preflight.outputs.circuit_should_run == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.preflight.outputs.base_oid }}
          path: _base
          persist-credentials: false
          fetch-depth: 1
      - name: Download bound review artifacts
        if: needs.preflight.outputs.circuit_should_run == 'true'
        continue-on-error: true
        id: download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: central-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: _review
      - name: Refetch PR, validate artifacts, and publish
        id: publish
        continue-on-error: true
        if: needs.preflight.outputs.circuit_should_run == 'true' && steps.download.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_BASE: ${{ needs.preflight.outputs.base_oid }}
          EXPECTED_HEAD: ${{ needs.preflight.outputs.head_oid }}
          POLICY_PATH: ${{ inputs.policy_path }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_WORKFLOW_REF: ${{ needs.preflight.outputs.workflow_ref }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find _review -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          [[ "${files[*]}" == 'manifest.json review.json review.md' ]] || { echo 'Unexpected artifact file set.' >&2; exit 1; }
          find _review -mindepth 1 -maxdepth 1 -type f | grep -q .
          [[ "$(find _review -mindepth 1 -maxdepth 1 ! -type f -print -quit)" == '' ]] || { echo 'Artifact contains a non-regular file.' >&2; exit 1; }
          response="$(curl --fail-with-body --silent --show-error -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          base_oid="$(jq -er '.base.sha | select(test("^[0-9a-f]{40}$"))' <<<"$response")"
          head_oid="$(jq -er '.head.sha | select(test("^[0-9a-f]{40}$"))' <<<"$response")"
          [[ "$base_oid" == "$EXPECTED_BASE" && "$head_oid" == "$EXPECTED_HEAD" ]] || { echo 'PR changed after review; refusing to publish stale artifacts.' >&2; exit 1; }
          [[ "$(wc -c < _review/review.json)" -le 1048576 ]] || { echo 'review.json exceeds size limit.' >&2; exit 1; }
          [[ "$(wc -c < _review/review.md)" -le 65536 ]] || { echo 'review.md exceeds size limit.' >&2; exit 1; }
          [[ "$(wc -c < _review/manifest.json)" -le 16384 ]] || { echo 'manifest.json exceeds size limit.' >&2; exit 1; }
          POLICY_SHA256="$(POLICY_PATH="$POLICY_PATH" node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            import { assertRegularFileInsideWorkspace } from "./_central/src/workspace-boundary.mjs";
            import { sha256 } from "./_central/src/pr-context.mjs";
            const source = await assertRegularFileInsideWorkspace("_base", process.env.POLICY_PATH);
            process.stdout.write(sha256(await readFile(source.path, "utf8")));
          ')"
          BASE_OID="$base_oid" HEAD_OID="$head_oid" REPOSITORY="$GITHUB_REPOSITORY" POLICY_SHA256="$POLICY_SHA256" EXPECTED_RUN_ID="$EXPECTED_RUN_ID" EXPECTED_RUN_ATTEMPT="$EXPECTED_RUN_ATTEMPT" EXPECTED_WORKFLOW_REF="$EXPECTED_WORKFLOW_REF" node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            import { canFinalize } from "./_central/src/finalizer.mjs";
            const manifest = JSON.parse(await readFile("_review/manifest.json", "utf8"));
            const artifacts = {
              "review.json": await readFile("_review/review.json", "utf8"),
              "review.md": await readFile("_review/review.md", "utf8"),
            };
            canFinalize({
              manifest,
              currentPullRequest: {
                repository: process.env.REPOSITORY,
                pullNumber: Number(process.env.PR_NUMBER),
                baseOid: process.env.BASE_OID,
                headOid: process.env.HEAD_OID,
              },
              artifacts,
              binding: {
                runId: process.env.EXPECTED_RUN_ID,
                runAttempt: process.env.EXPECTED_RUN_ATTEMPT,
                workflowRef: process.env.EXPECTED_WORKFLOW_REF,
                policySha256: process.env.POLICY_SHA256,
              },
            });
          '
          decision="$(jq -er '
            if (
              type == "object" and
              (keys | sort == ["decision","failures","findings","omittedSuggestions","suggestions","version"]) and
              .version == "v2" and
              (.decision == "approve" or .decision == "request_changes" or .decision == "infrastructure_failure") and
              (.findings | type == "array" and length <= 128 and all(.[];
                type == "object" and
                (keys | sort == ["evidence","fingerprint","level","line","path","rootCause","taxonomy","title"]) and
                (.taxonomy | type == "string" and test("^[a-z][a-z0-9-]{0,63}$")) and
                (.path | type == "string" and length >= 1 and length <= 500 and contains("\u0000") == false and startswith("/") == false and test("(^|/)\\.\\.(/|$)") == false) and
                (.line | type == "number" and . >= 1 and floor == .) and
                (.title | type == "string" and length >= 1 and length <= 180) and
                (.evidence | type == "string" and length >= 1 and length <= 6000) and
                (.rootCause | type == "string" and length >= 1 and length <= 2000) and
                (.level == "blocker" or .level == "major" or .level == "minor") and
                (.fingerprint | type == "string" and test("^[a-f0-9]{64}$")))) and
              (.suggestions | type == "array" and length <= 16 and all(.[];
                type == "object" and
                (keys | sort == ["evidence","fingerprint","level","line","path","rootCause","taxonomy","title"]) and
                (.taxonomy | type == "string" and test("^[a-z][a-z0-9-]{0,63}$")) and
                (.path | type == "string" and length >= 1 and length <= 500 and contains("\u0000") == false and startswith("/") == false and test("(^|/)\\.\\.(/|$)") == false) and
                (.line | type == "number" and . >= 1 and floor == .) and
                (.title | type == "string" and length >= 1 and length <= 180) and
                (.evidence | type == "string" and length >= 1 and length <= 6000) and
                (.rootCause | type == "string" and length >= 1 and length <= 2000) and
                .level == "suggestion" and
                (.fingerprint | type == "string" and test("^[a-f0-9]{64}$")))) and
              (.omittedSuggestions | type == "number" and . >= 0 and floor == .) and
              (.failures | type == "array" and length <= 512 and all(.[];
                type == "object" and
                ((keys | sort == ["error","stage","status"]) or (keys | sort == ["diagnostic","error","stage","status"])) and
                (.stage | type == "string" and length >= 1 and length <= 300) and
                (.status == "infra_error" or .status == "schema_error") and
                (.error | type == "string" and length >= 1 and length <= 4000) and
                (has("diagnostic") == false or (.diagnostic | type == "string" and length >= 1 and length <= 4000)))) and
              (if .decision == "infrastructure_failure"
               then (.findings | length == 0) and (.suggestions | length == 0) and .omittedSuggestions == 0 and (.failures | length >= 1)
               elif .decision == "approve"
               then (.failures | length == 0) and all(.findings[]; .level == "minor")
               else (.failures | length == 0) and (.findings | length >= 1)
               end)
            ) then .decision else error("invalid final review schema") end
          ' _review/review.json)"
          printf 'decision=%s\n' "$decision" >> "$GITHUB_OUTPUT"
          jq -n --rawfile body _review/review.md '{body:$body}' | curl --fail-with-body --silent --show-error -X POST \
            -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Content-Type: application/json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --data-binary @-
      - name: Publish missing-artifact infrastructure handoff
        id: handoff
        continue-on-error: true
        if: needs.preflight.outputs.circuit_should_run == 'true' && steps.download.outcome != 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          body='## Central review\n\n**Decision:** `infrastructure_failure`\n\nThe read-only review job did not produce a verifiable artifact. No code verdict was inferred.'
          jq -n --arg body "$body" '{body:$body}' | curl --fail-with-body --silent --show-error -X POST \
            -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Content-Type: application/json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --data-binary @-
      - name: Record infrastructure failure in caller circuit
        if: >-
          always() &&
          needs.preflight.outputs.circuit_should_run == 'true' &&
          (steps.download.outcome != 'success' ||
           steps.publish.outcome == 'failure' ||
           steps.publish.outputs.decision == 'infrastructure_failure')
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          REVIEW_DECISION: ${{ steps.publish.outputs.decision }}
          CIRCUIT_THRESHOLD: '3'
          CIRCUIT_WINDOW_MINUTES: '60'
          CIRCUIT_DURATION_MINUTES: '60'
        run: |
          set -euo pipefail
          if [[ "$DOWNLOAD_OUTCOME" != 'success' ]]; then
            phase='artifact_download'
          elif [[ "$PUBLISH_OUTCOME" != 'success' ]]; then
            phase='finalize_publish'
          elif [[ "$REVIEW_DECISION" == 'infrastructure_failure' ]]; then
            phase='review'
          else
            echo 'No infrastructure failure is eligible for circuit recording.' >&2
            exit 1
          fi
          FAILURE_PHASE="$phase" node _central/src/run-circuit.mjs record
      - name: Preserve circuit skip as a non-verdict failure
        if: needs.preflight.outputs.circuit_should_run == 'false'
        shell: bash
        run: exit 1
      - name: Preserve validated review outcome
        if: >-
          needs.preflight.outputs.circuit_should_run == 'true' &&
          (steps.download.outcome != 'success' ||
           steps.publish.outcome != 'success' ||
           steps.handoff.outcome == 'failure' ||
           steps.publish.outputs.decision == 'infrastructure_failure' ||
           (steps.publish.outputs.decision == 'request_changes' && inputs.shadow != true))
        shell: bash
        run: exit 1
