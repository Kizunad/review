# review engine v2 - runner orchestration harness (design 5.5, 5.7, 5.9).
#
# Boots a tmux session on the runner: a trunk pane (cc-review) that classifies
# the diff, directs the crew, and judges; two crew panes (cc-review-lite) that
# write and run tests and drop evidence; plus a checkpoint watchdog. A
# deterministic bash wrapper validates the trunk's review.json, scans crew
# output for leaked credentials, and converts trunk death/timeout into
# decision=infrastructure_failure.
#
# PROBE MODE is wired: build-server builds the binary from the reviewed head in a
# job this workflow owns, so binaryProvenance can name this pipeline's build. The
# caller supplies only the build COMMAND - including its own prerequisites, since
# those are caller-specific the same way the command is (Bong needs
# protobuf-compiler; another caller will need something else).
#
# Smoke trials run via workflow_dispatch on this branch (gh workflow run
# review-v2-p1.yml --ref <branch> -f repository=... -f pull_number=... -f head_oid=...).
name: review-v2-p1

on:
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      pull_number:
        required: true
        type: string
      head_oid:
        required: true
        type: string
      engine_ref:
        required: false
        type: string
        default: ''
      trunk_model:
        required: false
        type: string
        default: ''
      # Same shape as v1 review.yml on purpose: the relay URL is an input (not a secret) and
      # the key is `review_api_key`. P1 originally declared AXONHUB_BASE_URL and
      # PI_AXONHUB_API_KEY, which exist in NEITHER Kizunad/review nor Kizunad/Bong - so every
      # trial booted with an empty relay and died as "trunk pane never came alive". Reusing
      # v1's names means v2 inherits plumbing that is already proven in production.
      review_base_url:
        required: false
        type: string
        default: ''
      # PROBE MODE. The build JOB lives here, in the reusable workflow, and only the build
      # COMMAND comes from the caller. That split is forced by the provenance rule, it is not
      # a preference: the rule says the binary under test may only be this pipeline's build of
      # the reviewed head, and an engine that receives a finished artifact from its caller
      # cannot verify that - it can only trust it, which is the thing the rule forbids. So the
      # engine checks the head out itself, runs the caller's command in a job it owns, and
      # stamps buildRunId with its OWN run id. The caller keeps the part that is genuinely
      # caller-specific (cargo vs gradle vs npm) and none of the part that is a trust boundary.
      #
      # Leave build_command empty and probe mode is simply unavailable: the harness reports it,
      # the trunk does not assign it, and a worker told to probe anyway returns verdict=blocked
      # rather than inventing a binary.
      build_command:
        description: 'shell command that builds the binary under test, run at the reviewed head'
        required: false
        type: string
        default: ''
      build_artifact_path:
        description: 'path to the built binary, relative to the repo root'
        required: false
        type: string
        default: ''
      # Same input name and meaning as v1, so a caller switching engines changes the `uses:`
      # line and nothing else. It is not decoration here either: the trunk READS this file and
      # judges against its rules, and the manifest binds its SHA-256. Without it the review
      # still runs but cannot be published, because a manifest that names a policy the reviewer
      # never saw would make the gate's strongest guarantee meaningless.
      policy_path:
        description: 'project review policy, read from the BASE commit (empty = review runs but cannot publish)'
        required: false
        type: string
        default: ''
    secrets:
      review_api_key:
        required: true
  workflow_dispatch:
    inputs:
      repository:
        description: 'owner/repo to review (defaults to this repo)'
        required: false
        default: 'Kizunad/review'
        type: string
      pull_number:
        description: 'PR number to review'
        required: true
        type: string
      head_oid:
        description: 'PR head commit sha'
        required: true
        type: string
      trunk_model:
        description: 'model id the relay serves for the trunk (empty = relay default)'
        required: false
        default: ''
        type: string
      # Mirrored from workflow_call on purpose. Without these a dispatch trial cannot reach
      # probe mode at all - build_command would always be empty, build-server would skip, and
      # rv2_probe_available would report "not built" forever. The one mode that has never run
      # would have stayed unreachable by the only entry point available for trying it.
      build_command:
        description: 'shell command that builds the binary under test, run at the reviewed head (empty = no probe)'
        required: false
        default: ''
        type: string
      build_artifact_path:
        description: 'path to the built binary, relative to the repo root'
        required: false
        default: ''
        type: string
      policy_path:
        description: 'project review policy, read from the BASE commit (empty = review runs but cannot publish)'
        required: false
        default: ''
        type: string

jobs:
  # The binary under probe is built HERE, from the reviewed head, in a job this workflow owns.
  # Skipped entirely when the caller supplies no build_command, which is the normal case for a
  # scripts-only PR - probe is then unavailable rather than faked.
  build-server:
    if: inputs.build_command != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the reviewed head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.head_oid }}
          persist-credentials: false

      # The head is verified HERE rather than trusted from the input. checkout resolves a ref;
      # this asserts that what landed on disk is the exact commit under review, so a binary can
      # never be built from a head that moved between dispatch and build.
      - name: Assert the checkout is at the reviewed head
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "${{ inputs.head_oid }}" ]; then
            echo "build-server: checkout is at $actual, expected ${{ inputs.head_oid }}" >&2
            echo "build-server: refusing to build - the binary must be the reviewed commit" >&2
            exit 1
          fi
          echo "build-server: at ${{ inputs.head_oid }}"

      - name: Build
        run: ${{ inputs.build_command }}

      - name: Assert the binary exists
        run: |
          [ -f "${{ inputs.build_artifact_path }}" ] || {
            echo "build-server: build_command succeeded but ${{ inputs.build_artifact_path }} is missing" >&2
            echo "build-server: a probe with no binary is verdict=blocked, not a silent static review" >&2
            exit 1
          }
          ls -l "${{ inputs.build_artifact_path }}"

      - name: Upload the binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rv2-binary
          path: ${{ inputs.build_artifact_path }}
          if-no-files-found: error
          retention-days: 1

  review:
    needs: [build-server]
    # The review runs whether or not the build did, and ONLY a cancellation stops it.
    #
    # `needs` on a skipped job skips this one too, so the guard is required at all for the
    # common case: a scripts-only PR with no build_command. It first also excluded 'failure',
    # and that was wrong. A skipped job produces NOTHING - no review.json, no artifact, no
    # infrastructure_failure - so a broken build meant the run vanished silently, which is
    # strictly worse than a clean INFRA and is the same mistake as letting GitHub kill the job
    # on wall-clock instead of reporting a timeout.
    #
    # A failed build does not mean no review; it means no PROBE. The harness already draws that
    # distinction - rv2_probe_available returns 2 for "the build path is broken", separately
    # from 1 for "we did not build" - and the trunk prompt requires a recorded failure on 2
    # rather than a silent downgrade to static. Skipping the job threw that away before it could
    # be used.
    if: always() && needs.build-server.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HARNESS_DIR: ${{ github.workspace }}/_rv2
      RV2_ROOT: ${{ github.workspace }}/_rv2
      RV2_REPOSITORY: ${{ inputs.repository }}
      PR_NUMBER: ${{ inputs.pull_number }}
      HEAD_OID: ${{ inputs.head_oid }}
      # ENGINE_PIN is NOT set here. Under workflow_call github.sha is the CALLER's commit, so
      # setting it at job level would bake in the wrong value before anything could correct it -
      # see the "Resolve the engine's own commit" step, which publishes the real one to
      # GITHUB_ENV before any step that reads it. Job-level env cannot be overridden by
      # GITHUB_ENV, which is exactly why this line is absent rather than defaulted.
      RUN_ID: ${{ github.run_id }}
      RV2_WORKFLOW_FILE: review-v2-p1.yml
      # ONE relay, one pair of names. The AXONHUB_BASE_URL / PI_AXONHUB_API_KEY pair is gone
      # with pi (design 5.9): it existed only because pi's built-in provider ignored
      # ANTHROPIC_BASE_URL and had to be routed through a vendored plugin. Both the trunk
      # (cc-review) and the crew (cc-review-lite) are Claude Code and honor these two
      # directly - probed 2026-08-08 for claude.
      #
      # The `||` chain covers both call shapes: workflow_call supplies review_base_url /
      # review_api_key, while a workflow_dispatch smoke trial falls back to whatever the
      # owning repo defines. secrets.<undeclared> is empty rather than an error, so the same
      # expression is valid in both modes.
      ANTHROPIC_BASE_URL: ${{ inputs.review_base_url || vars.REVIEW_CLAUDE_BASE_URL || 'https://api.claudeopus.world' }}
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.review_api_key || secrets.REVIEW_CLAUDE_API_KEY }}
      # Model policy lives in v2/lib.sh (rv2_trunk_model / rv2_worker_model) so a pane cannot
      # boot on the wrong tier. ANTHROPIC_MODEL is deliberately NOT set: it would apply to
      # every claude process in the job, trunk and crew alike, and silently override the
      # per-pane --model that keeps the two roles apart.
      RV2_TRUNK_MODEL: ${{ inputs.trunk_model }}
    steps:
      # RESOLVED BEFORE THE CHECKOUT, because the checkout depends on it.
      #
      # Inside a reusable workflow the github context belongs to the CALLER. actions/checkout
      # with no `repository:` therefore checks out BONG, not this engine - so every path below
      # (v2/boot-session.sh, harness/, src/) would be missing, under workflow_call only. v2 has
      # only ever run via workflow_dispatch, where github.repository happens to BE this repo, so
      # the bug is invisible in the one mode that has been exercised. Same shape as the
      # first-run-gates bug: correct in the tested mode, broken in the shipped one.
      #
      # referenced_workflows names both halves - "Owner/Repo/.github/workflows/x.yml@<sha>" -
      # so the repository and the commit both come from what actually ran rather than from a
      # hard-coded name or from github.sha, which is the caller's commit and answers a different
      # question. github.sha is the correct fallback under dispatch, where there is no caller.
      - name: Resolve the engine's own repository and commit
        id: engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo='' ref=''
          if [ "${{ github.event_name }}" != workflow_dispatch ]; then
            run_json="$(curl --fail-with-body --silent --show-error \
              -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT")"
            entry="$(jq -r '
              [ .referenced_workflows[]?
                | select(.path | contains("/.github/workflows/review-v2-p1.yml@")) ]
              | if length == 1 then .[0].path else "" end
            ' <<<"$run_json")"
            if [ -n "$entry" ]; then
              repo="${entry%%/.github/workflows/*}"
              ref="$(printf '%s' "${entry##*@}" | tr 'A-F' 'a-f')"
            fi
          fi
          if [ -z "$ref" ]; then
            repo='${{ github.repository }}'
            ref='${{ inputs.engine_ref || github.sha }}'
            echo "engine: no referenced_workflows entry - dispatch mode, using $repo@$ref"
          else
            echo "engine: this run called $repo/.github/workflows/review-v2-p1.yml@$ref"
          fi
          printf '%s' "$ref" | grep -qE '^[0-9a-f]{40}$' || {
            echo "engine: '$ref' is not a 40-hex commit SHA - refusing to check out an ambiguous engine" >&2
            exit 1
          }
          printf 'ENGINE_PIN=%s\n' "$ref" >>"$GITHUB_ENV"
          printf 'RV2_ENGINE_REF=%s\n' "$ref" >>"$GITHUB_ENV"
          printf 'ref=%s\n' "$ref" >>"$GITHUB_OUTPUT"
          printf 'repo=%s\n' "$repo" >>"$GITHUB_OUTPUT"

      - name: Checkout engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ steps.engine.outputs.repo }}
          ref: ${{ steps.engine.outputs.ref }}
          persist-credentials: false

      # The checkout is asserted, not assumed: a ref that resolves to something else leaves the
      # engine silently running a different commit than the one the manifest will claim.
      - name: Assert the engine checkout matches the resolved commit
        run: |
          actual="$(git rev-parse HEAD)"
          [ "$actual" = "${{ steps.engine.outputs.ref }}" ] || {
            echo "engine: checkout is at $actual, expected ${{ steps.engine.outputs.ref }}" >&2
            exit 1
          }
          [ -x v2/boot-session.sh ] || { echo "engine: v2/boot-session.sh missing - wrong repository" >&2; exit 1; }
          echo "engine: at $actual with the harness present"

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install hash-pinned Claude Code
        uses: ./.github/actions/setup-claude

      - name: Install runner harness (tmux + jq)
        run: v2/install-runner.sh

      - name: Prepare repo under review
        run: v2/prepare-repo.sh

      # Probe mode's binary. Downloaded into a path the crew can reach, and stamped with the
      # build's provenance. buildRunId is THIS run's id because this run is what built it -
      # that is the whole point of the build job living here.
      - name: Fetch the binary under probe
        if: needs.build-server.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rv2-binary
          path: ${{ env.HARNESS_DIR }}/bin

      - name: Publish probe availability
        run: |
          if [ "${{ needs.build-server.result }}" = "success" ]; then
            binary="$HARNESS_DIR/bin/$(basename '${{ inputs.build_artifact_path }}')"
            chmod +x "$binary" 2>/dev/null || true
            {
              printf 'RV2_BINARY_PATH=%s\n' "$binary"
              printf 'RV2_BUILD_RUN_ID=%s\n' "${{ github.run_id }}"
            } >>"$GITHUB_ENV"
            echo "probe available: $binary (buildRunId ${{ github.run_id }})"
          elif [ "${{ needs.build-server.result }}" = "failure" ]; then
            # A build that was ASKED FOR and BROKE is not the same as no build. The caller
            # wanted probe; it is unavailable because something is wrong, and the review must
            # say so instead of quietly reviewing a server change without ever running it.
            printf 'RV2_BUILD_FAILED=1\n' >>"$GITHUB_ENV"
            echo "probe BROKEN: build-server FAILED - the caller asked for a build and it did not"
            echo "produce a binary. The trunk must record a failure, not fall back to static."
          else
            # Said out loud rather than left as an unset variable. "probe is unavailable" and
            # "someone forgot to plumb the path" look identical to a trunk reading an empty
            # env var, and only one of them is a reason to skip probe.
            echo "probe UNAVAILABLE: build-server result=${{ needs.build-server.result }} (no build requested)"
            echo "the trunk must not assign probe mode; static and test only"
          fi

      # The merge gate's two anchors, resolved from the API rather than trusted from the inputs.
      #
      # baseOid is needed for the manifest and the policy hash; headOid is asserted against the
      # input because a PR that moved between dispatch and review must not be reviewed as though
      # it had not. The build job already asserts the same thing about its checkout - this is the
      # review side of the same rule.
      #
      # The POLICY IS READ FROM THE BASE, never from the head. It is the file that decides what
      # counts as a blocker, so taking it from the pull request would let a change weaken the
      # standard it is judged by in the same commit. v1 does this by checking out the base; here
      # the repo under review is already cloned, so the base object is fetched into it and read
      # with `git show` - one fetch instead of a second checkout, same source of truth.
      - name: Resolve PR anchors and hash the review policy
        id: anchors
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_PATH: ${{ inputs.policy_path }}
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/${{ inputs.repository }}/pulls/${{ inputs.pull_number }}")"
          base_oid="$(jq -er '.base.sha | select(test("^[0-9a-f]{40}$"))' <<<"$response")"
          head_oid="$(jq -er '.head.sha | select(test("^[0-9a-f]{40}$"))' <<<"$response")"
          if [ "$head_oid" != "${{ inputs.head_oid }}" ]; then
            echo "anchors: the pull request head is $head_oid, not ${{ inputs.head_oid }}" >&2
            echo "anchors: it moved after this run was requested - refusing to review a stale head" >&2
            exit 1
          fi
          printf 'BASE_OID=%s\n' "$base_oid" >>"$GITHUB_ENV"
          echo "anchors: base $base_oid, head $head_oid"

          if [ -z "$POLICY_PATH" ]; then
            echo "anchors: no policy_path - the trunk reviews without a project policy and the"
            echo "anchors: run CANNOT publish, because the manifest binds a policy hash."
            exit 0
          fi
          git -C "$RV2_ROOT/repo" fetch --depth 1 origin "$base_oid"
          policy_file="$RV2_ROOT/policy.json"
          git -C "$RV2_ROOT/repo" show "$base_oid:$POLICY_PATH" >"$policy_file"
          jq -e . "$policy_file" >/dev/null || { echo "anchors: policy is not valid JSON" >&2; exit 1; }
          printf 'POLICY_SHA256=%s\n' "$(sha256sum "$policy_file" | cut -d' ' -f1)" >>"$GITHUB_ENV"
          printf 'RV2_POLICY_FILE=%s\n' "$policy_file" >>"$GITHUB_ENV"
          echo "anchors: policy $POLICY_PATH from base, $(jq '.rules | length' "$policy_file") rules"

      - name: Build PR diff
        run: v2/build-diff.sh

      - name: Restore prior checkpoint (resume)
        run: v2/restore-checkpoint.sh

      # Free, unauthenticated, and it saves a whole run. The relay's CPU gate refuses on
      # arrival before auth, so this reaches no channel and spends nothing - and booting three
      # Claude Code sessions into a shedding relay is what turned run 31376928375 into fifty
      # minutes of idle.
      - name: Wait for the relay's CPU gate
        run: v2/wait-for-relay.sh

      - name: Boot harness session (trunk + workers + watchdog)
        id: boot
        run: v2/boot-session.sh

      # Only wait if there is something to wait FOR. The boot step reports its own failure, and
      # this used to poll for the full RV2_REVIEW_TIMEOUT_S afterwards anyway - fifty minutes of
      # runner time waiting on a review that was never started, on a run that already knew.
      #
      # A failed boot leaves the panes up (it dumps them and exits without killing the session),
      # so the dead-trunk early give-up does not fire either: rv2_alive sees a live claude that
      # simply never accepted its brief. Nothing was going to end this early except the clock.
      #
      # On skip, the wrapper still runs and still synthesizes decision=infrastructure_failure
      # from the absent review.json - which is the correct outcome and arrives at once.
      - name: Wait for review.json
        run: v2/wait-review.sh
        if: always() && steps.boot.conclusion == 'success'

      - name: Wrapper validate / synthesize
        run: v2/wrapper.sh
        if: always()

      # The runner's verdict, converted into the three files the merge gate publishes.
      #
      # Skipped without a policy hash rather than published with a placeholder: the manifest
      # binds policySha256, and a manifest that names a policy the review did not have is the
      # kind of lie the gate exists to make impossible. "Cannot publish" is a legitimate outcome
      # for a trial run; a manifest with an invented binding is not.
      - name: Build the publishable artifact
        id: publish
        if: always() && env.POLICY_SHA256 != ''
        env:
          REPOSITORY: ${{ inputs.repository }}
          PULL_NUMBER: ${{ inputs.pull_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          # The engine commit this run executed, resolved from referenced_workflows rather
          # than from github.sha - which under workflow_call is the caller's commit and would
          # make workflowRef a provenance claim about the wrong repository.
          WORKFLOW_REF: ${{ env.RV2_ENGINE_REF }}
        run: |
          set -euo pipefail
          node harness/publish-artifact.mjs "$RV2_ROOT/output/review.json" "$GITHUB_WORKSPACE/_publish"
          ls -l "$GITHUB_WORKSPACE/_publish"

      - name: Upload the publishable artifact
        if: always() && steps.publish.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rv2-publish
          path: _publish
          if-no-files-found: error
          retention-days: 7

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rv2-p1
          # Enumerated, not the whole HARNESS_DIR. prepare-repo.sh puts the repo under review
          # at $ROOT/repo, so uploading the root shipped an entire Bong checkout: the first
          # successful trial produced a 245MB artifact that took minutes to download and would
          # have burned storage quota within a handful of runs. Everything a human or a resume
          # needs to reconstruct the run is in these paths; the checkout is reproducible from
          # head_oid and belongs nowhere near an artifact.
          #
          # RELATIVE to the workspace, not ${{ env.HARNESS_DIR }}. Absolute paths made the
          # artifact's entries rooted, and `gh run download` refuses those outright: "would
          # result in path traversal". Measured 2026-08-10 while trying to read the pane dump
          # from a failed run - the diagnostic bundle could only be fetched by hand through the
          # zip API. An artifact that the standard tool will not open is one nobody reads at the
          # moment they need it, which is the only moment it exists for.
          path: |
            _rv2/output
            _rv2/evidence
            _rv2/logs
            _rv2/checkpoint
            _rv2/resume
            _rv2/directives
            _rv2/assignments
            _rv2/ledger.tsv
          if-no-files-found: warn
