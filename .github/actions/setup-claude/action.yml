name: Set up pinned Claude Code
description: Install reviewed native Claude Code and ripgrep binaries without package scripts

outputs:
  executable:
    description: Absolute path to the verified Claude Code executable
    value: ${{ steps.install.outputs.executable }}
  ripgrep:
    description: Absolute path to the verified ripgrep executable
    value: ${{ steps.install.outputs.ripgrep }}

runs:
  using: composite
  steps:
    - name: Install hash-pinned native binary
      id: install
      shell: bash
      env:
        CLAUDE_URL: https://registry.npmjs.org/@anthropic-ai/claude-code-linux-x64/-/claude-code-linux-x64-2.1.220.tgz
        CLAUDE_SHA256: 25d2e2cae6d3d1d5ceeaf0da02e83c45c16455e45efa1ab305395dc05227ad0d
        RIPGREP_URL: https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/ripgrep-14.1.1-x86_64-unknown-linux-musl.tar.gz
        RIPGREP_SHA256: 4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e
      run: |
        set -euo pipefail
        install_root="$(mktemp -d "$RUNNER_TEMP/central-review-claude.XXXXXX")"
        archive="$install_root/claude.tgz"
        ripgrep_archive="$install_root/ripgrep.tgz"
        mkdir -p "$install_root/bin"
        curl --fail-with-body --silent --show-error --location "$CLAUDE_URL" -o "$archive"
        curl --fail-with-body --silent --show-error --location "$RIPGREP_URL" -o "$ripgrep_archive"
        printf '%s  %s\n' "$CLAUDE_SHA256" "$archive" | sha256sum --check --strict
        printf '%s  %s\n' "$RIPGREP_SHA256" "$ripgrep_archive" | sha256sum --check --strict
        tar --extract --gzip --file "$archive" --directory "$install_root/bin" \
          --strip-components=1 --no-same-owner --no-same-permissions package/claude
        tar --extract --gzip --file "$ripgrep_archive" --directory "$install_root/bin" \
          --strip-components=1 --no-same-owner --no-same-permissions ripgrep-14.1.1-x86_64-unknown-linux-musl/rg
        claude_executable="$install_root/bin/claude"
        ripgrep_executable="$install_root/bin/rg"
        [[ -f "$claude_executable" && ! -L "$claude_executable" ]] || {
          echo 'Pinned Claude Code executable is not a regular file.' >&2
          exit 1
        }
        [[ -f "$ripgrep_executable" && ! -L "$ripgrep_executable" ]] || {
          echo 'Pinned ripgrep executable is not a regular file.' >&2
          exit 1
        }
        chmod 0555 "$claude_executable" "$ripgrep_executable"
        [[ "$(od -An -tx1 -N4 "$claude_executable" | tr -d ' \n')" == '7f454c46' ]] || {
          echo 'Pinned Claude Code executable is not ELF.' >&2
          exit 1
        }
        [[ "$($claude_executable --version)" == '2.1.220 (Claude Code)' ]]
        [[ "$($ripgrep_executable --version | sed -n '1p')" == 'ripgrep 14.1.1 (rev 4649aa9700)' ]]
        printf 'executable=%s\n' "$claude_executable" >> "$GITHUB_OUTPUT"
        printf 'ripgrep=%s\n' "$ripgrep_executable" >> "$GITHUB_OUTPUT"
        printf 'CLAUDE_EXECUTABLE=%s\n' "$claude_executable" >> "$GITHUB_ENV"
        printf 'RIPGREP_EXECUTABLE=%s\n' "$ripgrep_executable" >> "$GITHUB_ENV"
